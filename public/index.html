<!DOCTYPE html>
<html lang="id" class="bg-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLC - Lirik Lagu GMS Lampung</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-white text-gray-800 min-h-screen">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-20 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-10 h-10 shrink-0 rounded-lg bg-brand-600 text-white flex items-center justify-center text-xl font-bold">F</div>
                <div class="min-w-0">
                    <h1 class="text-lg font-bold text-gray-900 leading-tight">FLC - Lirik Lagu</h1>
                    <p class="text-xs text-gray-500 hidden sm:block">Lirik lagu GMS Lampung (Serverless Netlify)</p>
                </div>
            </div>
            <button id="btnRefresh" onclick="loadItems()" class="shrink-0 px-3 sm:px-4 py-2 rounded-lg bg-brand-500 hover:bg-brand-600 text-white text-sm font-medium transition">
                Muat Ulang
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">

        <div id="toast" class="hidden fixed top-20 left-1/2 -translate-x-1/2 z-50 px-4 py-3 rounded-lg shadow-lg text-white text-sm font-medium"></div>

        <div id="pinBox" class="mb-6 hidden">
            <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 flex flex-col sm:flex-row items-center gap-3">
                <p class="text-xs text-amber-800 font-medium flex-1 text-center sm:text-left">Sesi Admin aktif. Masukkan PIN untuk menyimpan/menghapus.</p>
                <input id="adminPin" type="password" placeholder="PIN Admin" class="px-3 py-1.5 rounded-lg border border-amber-300 text-sm outline-none focus:ring-2 focus:ring-amber-500/30" onchange="savePin()">
            </div>
        </div>

        <div class="bg-white border border-gray-200 rounded-2xl shadow-sm overflow-hidden">
            <div class="flex border-b border-gray-200 bg-gray-50 overflow-x-auto">
                <button data-tab="cari" class="tab-btn flex-1 whitespace-nowrap px-2 sm:px-4 py-3 text-xs sm:text-sm font-semibold text-gray-600 hover:text-brand-600 border-b-2 border-transparent transition">Cari Lagu</button>
                <button data-tab="semua" class="tab-btn flex-1 whitespace-nowrap px-2 sm:px-4 py-3 text-xs sm:text-sm font-semibold text-gray-600 hover:text-brand-600 border-b-2 border-transparent transition">Semua Lagu</button>
                <button data-tab="tambah" class="tab-btn flex-1 whitespace-nowrap px-2 sm:px-4 py-3 text-xs sm:text-sm font-semibold text-gray-600 hover:text-brand-600 border-b-2 border-transparent transition">Tambah Lagu</button>
            </div>

            <!-- Tab: Cari -->
            <section id="tab-cari" class="tab-panel p-6">
                <div class="flex flex-col sm:flex-row gap-3 mb-4">
                    <input id="searchInput" type="text" placeholder="Ketik judul atau lirik..."
                        class="flex-1 rounded-xl border border-gray-300 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 px-4 py-2.5 text-sm outline-none"
                        onkeydown="if(event.key==='Enter')doSearch()">
                    <button onclick="doSearch()" class="px-5 py-2.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold transition">Cari</button>
                </div>
                <select id="songSelect" onchange="selectFromDropdown()"
                    class="w-full rounded-xl border border-gray-300 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 px-4 py-2.5 text-sm outline-none bg-white mb-4">
                    <option value="">— Pilih lagu dari daftar —</option>
                </select>
                <div id="searchResults" class="space-y-4">
                    <p class="text-sm text-gray-500 text-center py-8">Ketik kata kunci atau pilih lagu untuk melihat lirik.</p>
                </div>
            </section>

            <!-- Tab: Semua Lagu -->
            <section id="tab-semua" class="tab-panel p-6 hidden">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-semibold text-gray-900">Semua Lagu</h2>
                    <span id="countBadge" class="text-xs px-2.5 py-1 rounded-full bg-brand-100 text-brand-700 font-semibold">0 lagu</span>
                </div>
                <div id="allSongs" class="space-y-3">
                    <p class="text-sm text-gray-500 text-center py-8">Memuat...</p>
                </div>
            </section>

            <!-- Tab: Tambah -->
            <section id="tab-tambah" class="tab-panel p-6 hidden">
                <form id="addForm" onsubmit="return false">
                    <label class="block text-sm font-semibold text-gray-700 mb-2" for="titleInput">Judul Lagu</label>
                    <input id="titleInput" type="text" required
                        class="w-full rounded-xl border border-gray-300 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 px-4 py-2.5 text-sm outline-none mb-4"
                        placeholder="Contoh: Ajar Kami Tuhan">
                    <label class="block text-sm font-semibold text-gray-700 mb-2" for="lyricsInput">Lirik</label>
                    <textarea id="lyricsInput" rows="12" required
                        class="w-full rounded-xl border border-gray-300 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 p-4 text-sm outline-none resize-y"
                        placeholder="Tulis atau tempel lirik lagu di sini..."></textarea>
                    <div class="mt-4 flex flex-wrap gap-3">
                        <button onclick="addSong()" class="px-5 py-2.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold transition">Simpan Lagu</button>
                        <button onclick="clearForm()" type="button" class="px-5 py-2.5 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-100 text-sm font-semibold transition">Bersihkan</button>
                    </div>
                </form>
            </section>
        </div>
    </main>

    <footer class="max-w-4xl mx-auto px-4 pb-8 text-center text-xs text-gray-400">
        FLC - Lirik Lagu GMS Lampung &middot; Serverless on Netlify
    </footer>

    <script>
        const state = { items: [] };

        function showToast(msg, ok = true) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'fixed top-20 left-1/2 -translate-x-1/2 z-50 px-4 py-3 rounded-lg shadow-lg text-white text-sm font-medium ' +
                (ok ? 'bg-brand-600' : 'bg-red-500');
            el.classList.remove('hidden');
            clearTimeout(el._t);
            el._t = setTimeout(() => el.classList.add('hidden'), 2500);
        }

        async function api(path, options = {}) {
            // Path diarahkan ke /.netlify/functions/songs?action=...
            const pin = localStorage.getItem('flc_pin') || '';
            options.headers = options.headers || {};
            if (pin) options.headers['x-admin-pin'] = pin;

            const res = await fetch('/api' + (path.startsWith('?') ? path : '/' + path), options);
            const data = await res.json();
            if (!data.ok) {
                if (res.status === 401) {
                    showPinBox();
                    throw new Error('PIN Admin diperlukan atau salah');
                }
                throw new Error(data.error || 'Terjadi kesalahan');
            }
            return data;
        }

        function showPinBox() {
            document.getElementById('pinBox').classList.remove('hidden');
        }

        function savePin() {
            const val = document.getElementById('adminPin').value;
            localStorage.setItem('flc_pin', val);
            showToast('PIN disimpan secara lokal');
        }

        // Init PIN from local
        const savedPin = localStorage.getItem('flc_pin');
        if (savedPin) {
            document.getElementById('adminPin').value = savedPin;
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => switchTab(btn.dataset.tab));
        });

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => {
                const active = b.dataset.tab === tab;
                b.className = 'tab-btn flex-1 whitespace-nowrap px-2 sm:px-4 py-3 text-xs sm:text-sm font-semibold border-b-2 transition ' +
                    (active ? 'text-brand-600 border-brand-600 bg-white' : 'text-gray-600 hover:text-brand-600 border-transparent bg-gray-50');
            });
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
            document.getElementById('tab-' + tab).classList.remove('hidden');
            if (tab === 'semua') loadItems();
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        function renderSongCard(item, opts = {}) {
            const showActions = opts.showActions !== false;
            return `
                <div class="min-w-0 flex-1">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="text-[10px] uppercase tracking-wide px-2 py-0.5 rounded-full bg-brand-100 text-brand-700 font-bold">Lagu</span>
                        ${item.created ? `<span class="text-xs text-gray-400">${formatDate(item.created)}</span>` : ''}
                    </div>
                    <h3 class="text-base font-bold text-gray-900 mb-2">${escapeHtml(item.title)}</h3>
                    <p class="text-sm text-gray-700 whitespace-pre-wrap leading-relaxed">${escapeHtml(item.lyrics)}</p>
                    <div class="mt-2 flex flex-wrap gap-3">
                        <button onclick="copyLyrics('${item.id}')" class="text-xs font-semibold text-brand-600 hover:text-brand-700">Salin Lirik</button>
                        <button onclick="copyTitle('${item.id}')" class="text-xs font-semibold text-brand-600 hover:text-brand-700">Salin Judul</button>
                    </div>
                </div>
                ${showActions ? `<button onclick="deleteSong('${item.id}')" class="shrink-0 text-gray-400 hover:text-red-500 transition text-lg leading-none" title="Hapus">&times;</button>` : ''}`;
        }

        function renderList(items, containerId, emptyMsg, opts = {}) {
            const box = document.getElementById(containerId);
            if (!items.length) {
                box.innerHTML = '<p class="text-sm text-gray-500 text-center py-8">' + emptyMsg + '</p>';
                return;
            }
            box.innerHTML = '';
            items.forEach(item => {
                const el = document.createElement('div');
                el.className = 'border border-gray-200 rounded-xl p-4 hover:border-brand-300 transition flex items-start justify-between gap-4 bg-white';
                el.innerHTML = renderSongCard(item, opts);
                box.appendChild(el);
            });
        }

        function refreshSelect() {
            const sel = document.getElementById('songSelect');
            const cur = sel.value;
            sel.innerHTML = '<option value="">— Pilih lagu dari daftar —</option>' +
                state.items.map(s => `<option value="${escapeHtml(s.id)}">${escapeHtml(s.title)}</option>`).join('');
            if (cur) sel.value = cur;
        }

        function renderAll() {
            const badge = document.getElementById('countBadge');
            if (badge) badge.textContent = state.items.length + ' lagu';
            renderList(state.items, 'allSongs', 'Belum ada lagu. Tambahkan di tab Tambah Lagu.');
            refreshSelect();
        }

        function renderResults(items, emptyMsg) {
            const box = document.getElementById('searchResults');
            if (!items.length) {
                box.innerHTML = '<p class="text-sm text-gray-500 text-center py-8">' + emptyMsg + '</p>';
                return;
            }
            renderList(items, 'searchResults', emptyMsg);
        }

        function doSearch() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!q) {
                renderResults(state.items, 'Ketik kata kunci atau pilih lagu untuk melihat lirik.');
                return;
            }
            const hits = state.items.filter(s =>
                s.title.toLowerCase().includes(q) || s.lyrics.toLowerCase().includes(q)
            );
            renderResults(hits, 'Tidak ada lagu yang cocok dengan "' + escapeHtml(q) + '".');
        }

        function selectFromDropdown() {
            const id = document.getElementById('songSelect').value;
            if (!id) return;
            const song = state.items.find(s => s.id === id);
            if (!song) return;
            renderResults([song], 'Lagu tidak ditemukan.');
        }

        async function loadItems() {
            const allBox = document.getElementById('allSongs');
            allBox.innerHTML = '<p class="text-sm text-gray-500 text-center py-8">Memuat...</p>';
            try {
                const data = await api('?action=list');
                state.items = data.items;
                renderAll();
            } catch (e) {
                allBox.innerHTML = '<p class="text-sm text-red-500 text-center py-8">' + escapeHtml(e.message) + '</p>';
            }
        }

        async function addSong() {
            const title = document.getElementById('titleInput').value.trim();
            const lyrics = document.getElementById('lyricsInput').value.trim();
            if (!title) return showToast('Judul lagu wajib diisi', false);
            if (!lyrics) return showToast('Lirik lagu wajib diisi', false);
            try {
                await api('?action=add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, lyrics })
                });
                showToast('Lagu berhasil disimpan');
                clearForm();
                loadItems();
            } catch (e) {
                showToast(e.message, false);
            }
        }

        function clearForm() {
            document.getElementById('titleInput').value = '';
            document.getElementById('lyricsInput').value = '';
        }

        async function copyLyrics(id) {
            try {
                const data = await api('?action=get&id=' + encodeURIComponent(id));
                await navigator.clipboard.writeText(data.item.lyrics);
                showToast('Lirik disalin ke clipboard');
            } catch (e) {
                showToast('Gagal menyalin: ' + e.message, false);
            }
        }

        async function copyTitle(id) {
            const song = state.items.find(s => s.id === id);
            if (!song) return showToast('Lagu tidak ditemukan', false);
            try {
                await navigator.clipboard.writeText(song.title);
                showToast('Judul disalin ke clipboard');
            } catch (e) {
                showToast('Gagal menyalin: ' + e.message, false);
            }
        }

        async function deleteSong(id) {
            const song = state.items.find(s => s.id === id);
            const name = song ? song.title : 'lagu ini';
            if (!confirm('Hapus lagu "' + name + '"?')) return;
            try {
                await api('?action=delete&id=' + encodeURIComponent(id));
                showToast('Lagu dihapus');
                loadItems();
                document.getElementById('searchResults').innerHTML = '<p class="text-sm text-gray-500 text-center py-8">Ketik kata kunci atau pilih lagu untuk melihat lirik.</p>';
            } catch (e) {
                showToast(e.message, false);
            }
        }

        function formatDate(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        // Init
        loadItems();
    </script>
</body>
</html>
